[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdocs"
version = "1.0.0"
description = "Consulta documental em português com LangChain, FAISS e OpenRouter"
requires-python = ">=3.11,<3.12"
dependencies = [
  "langchain>=1.0,<2",
  "langchain-community>=0.4,<0.5",
  "langchain-text-splitters>=1.0,<2",
  "langchain-openrouter>=0.2,<0.3",
  "faiss-cpu>=1.12,<2",
  "streamlit>=1.50,<2",
  "numpy>=2,<3",
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "pip-tools>=7.5,<8"]

[project.scripts]
ragdocs = "ragdocs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: chamadas reais pagas (desativadas por padrão)"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
